<style>
:root{
  --bg:#071A17;
  --bg2:#0B2521;

  --panel:rgba(255,255,255,.055);
  --border:rgba(166,229,215,.16);

  --text:#F2FBF8;
  --dim:#A8C8C0;
  --dim2:#72938B;

  --accent:#2DD4BF;
  --accent2:#F4C95D;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
  scroll-padding-top:calc(90px + env(safe-area-inset-top,0px));
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  overflow-x:hidden;
}

h1,h2,h3,.font-display{
  font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
}

.grad-text{
  background:linear-gradient(
    90deg,
    #F2FBF8,
    var(--accent) 60%,
    var(--accent2)
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.bg-noise-grid{
  background-image:
    radial-gradient(
      rgba(166,229,215,.07) 1px,
      transparent 1px
    );
  background-size:26px 26px;
}

.glass{
  background:var(--panel);
  border:1px solid var(--border);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.glow-orb{
  position:absolute;
  border-radius:50%;
  filter:blur(70px);
  pointer-events:none;
}

#nav{
  top:env(safe-area-inset-top,0px);
}

.navlink{
  position:relative;
  color:var(--dim);
  transition:color .3s;
}

.navlink:hover,
.navlink.active{
  color:var(--text);
}

.navlink::after{
  content:'';
  position:absolute;
  left:0;
  bottom:-4px;
  width:0;
  height:1px;
  background:var(--accent);
  transition:width .3s;
}

.navlink:hover::after{
  width:100%;
}

.btn-primary{
  background:linear-gradient(
    135deg,
    var(--accent),
    #159F91
  );
  box-shadow:
    0 8px 30px -8px rgba(45,212,191,.35);
}

.btn-primary:hover{
  box-shadow:
    0 12px 40px -6px rgba(45,212,191,.55);
}

.btn-ghost{
  border:1px solid var(--border);
}

.btn-ghost:hover{
  border-color:rgba(166,229,215,.35);
  background:rgba(166,229,215,.045);
}

.tag{
  border:1px solid var(--border);
  background:rgba(255,255,255,.03);
}

.tag:hover{
  border-color:var(--accent);
  color:#fff;
  transform:translateY(-2px);
}

.dot-line{
  background:
    linear-gradient(var(--border),var(--border))
    left/1px 100% no-repeat;
}

::selection{
  background:var(--accent);
  color:#fff;
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}

  *{
    animation-duration:.001ms !important;
    transition-duration:.001ms !important;
  }
}

@keyframes floaty{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-14px)}
}

.floaty{
  animation:floaty 6s ease-in-out infinite;
}

#particle-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.section-pad{
  padding-top:7rem;
  padding-bottom:7rem;
}

@media (max-width:768px){
  .section-pad{
    padding-top:4.5rem;
    padding-bottom:4.5rem;
  }
}
</style>
